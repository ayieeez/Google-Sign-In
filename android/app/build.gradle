plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id 'com.google.gms.google-services' // Ensure this is added
}

android {
    namespace = "com.example.lab3_login_page"
    
    compileSdkVersion 34 // Update to latest compile SDK version

    ndkVersion flutter.ndkVersion

    compileOptions {
        // Use Java 11 for compatibility with Kotlin and Java
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        // Use JVM target 11, which is widely supported by Kotlin
        jvmTarget = "11"
    }

    defaultConfig {
        applicationId = "com.example.lab3_login_page"
        minSdkVersion 23 // Keep this line for the minimum SDK version
        targetSdkVersion 34 // Update to latest target SDK version

        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

// Add Firebase dependencies here
dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.5.0') // Firebase BOM for managing versions
    implementation 'com.google.firebase:firebase-auth' // Firebase Authentication
    implementation 'com.google.firebase:firebase-database' // Firebase Realtime Database

    // Add any other Firebase services you plan to use
    // For example:
    // implementation 'com.google.firebase:firebase-firestore'
    // implementation 'com.google.firebase:firebase-messaging'
}

// Ensure the Google services plugin is applied at the bottom of the file
apply plugin: 'com.google.gms.google-services'
